# A generic, single-database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, space separated, which will be added to sys.path
# prepend_syspath = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to use for the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be imported
# relative to the 'env.py' script location
# can_import_resources = false

# version locations.  specifies where to find migration scripts
# version_locations = %(here)s/alembic/versions

# version_table_schema - schema where the alembic_version table is stored
# version_table_schema =

# version_table - name of the table to store migrations history
# version_table = alembic_version

# output_encoding - encoding used to write migration files
# output_encoding = utf-8

sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/geonarrative


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
